{% block extra_css %}
<style>
    /* 深度诊断页首结论（对齐业务路径诊断阅读顺序） */
    .report-deep-hero {
        margin: 14px 0 0;
        padding: 14px 16px;
        border-radius: 12px;
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        border: 1px solid #e2e8f0;
        border-left: 5px solid #64748b;
    }
    .report-deep-hero--critical { border-left-color: #b71c1c; background: linear-gradient(135deg, #fff5f5 0%, #fef2f2 100%); }
    .report-deep-hero--error { border-left-color: #d32f2f; }
    .report-deep-hero--warning { border-left-color: #f9a825; }
    .report-deep-hero--success { border-left-color: #2e7d32; background: linear-gradient(135deg, #f1f8f4 0%, #ecfdf5 100%); }
    .report-deep-hero-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
    }
    .report-deep-verdict { font-weight: 700; font-size: 1rem; }
    .report-deep-dl { margin: 0; }
    .report-deep-row {
        display: grid;
        grid-template-columns: minmax(7em, 9em) 1fr;
        gap: 8px 12px;
        margin-bottom: 8px;
    }
    .report-deep-row dt { margin: 0; font-size: 0.82rem; font-weight: 700; color: #64748b; }
    .report-deep-row dd { margin: 0; font-size: 0.92rem; line-height: 1.5; }
    .report-deep-row--fault dt, .report-deep-row--fault dd { color: #b91c1c; }
    .report-deep-primary-fault { font-size: 1.05em; color: #b91c1c; }
    .report-deep-muted { color: #64748b; }
    .report-deep-narrative {
        margin: 10px 0 0;
        padding: 10px 12px;
        line-height: 1.6;
        background: rgba(255,255,255,0.65);
        border-left: 3px solid rgba(102,126,234,0.6);
        border-radius: 6px;
    }
    .report-deep-ruled-out { margin: 0; padding-left: 1.1em; }
    .report-deep-secondary-details,
    .report-deep-tech-details {
        margin-top: 10px;
        border: 1px dashed #cbd5e1;
        border-radius: 6px;
        padding: 6px 10px;
        background: rgba(255,255,255,0.5);
    }
    .report-deep-secondary-list { margin: 8px 0 0; padding-left: 1.2em; font-size: 0.9em; }
    .report-deep-secondary-note { margin-top: 2px; color: #57534e; font-size: 0.88em; }
    .report-deep-probe-result--fail { color: #b91c1c; font-weight: 700; }
    .report-deep-probe-result--partial { color: #b45309; font-weight: 700; }
    .report-deep-probe-result--ok { color: #15803d; font-weight: 700; }

    /* 拓扑图（无外部依赖） */
    .topology-flow {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    /* 主链在板块内均匀铺开（单行 + space-evenly；极宽时再横向滚动） */
    .topology-strip-wrap {
        width: 100%;
        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
        padding: 16px 12px 20px;
    }
    .topology-strip-wrap .topology-flow {
        display: flex;
        flex-wrap: nowrap;
        justify-content: space-evenly;
        align-items: stretch;
        width: 100%;
        min-width: min(100%, 680px);
        gap: clamp(10px, 2vw, 32px);
    }
    /* 参考页 sdwan_overlay_topology_cartoon_temp：舞台、分层标题、换行主链、连接符 */
    .topology-strip-wrap.topology-ref-stage {
        --ref-ink: #1e293b;
        --ref-muted: #64748b;
        --ref-purple: #7c3aed;
        --ref-purple-soft: #ede9fe;
        --ref-pink-soft: #fce7f3;
        --ref-shadow: 0 8px 24px rgba(30, 41, 59, 0.08);
        margin-top: 12px;
        padding: 26px 20px 30px !important;
        border-radius: 24px;
        background: linear-gradient(165deg, rgba(224, 242, 254, 0.5) 0%, #ffffff 44%, rgba(254, 243, 199, 0.38) 100%);
        box-shadow: var(--ref-shadow);
    }
    .topology-ref-layer-title {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--ref-muted);
        margin: 0 0 14px;
        padding-left: 4px;
    }
    .topology-ref-layer-title--overlay {
        color: var(--ref-purple);
        margin-top: 0;
        margin-bottom: 12px;
    }
    .topology-strip-wrap.topology-ref-stage .topology-flow {
        flex-wrap: wrap !important;
        justify-content: center !important;
        align-items: flex-start !important;
        gap: 12px 20px !important;
        min-width: 0 !important;
        width: 100%;
    }
    .topology-ref-node-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        flex: 0 1 auto;
        max-width: 220px;
    }
    .topology-ref-connector {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 36px;
        align-self: flex-start;
        margin-top: calc(clamp(84px, 18vw, 112px) * 0.38);
        font-size: 1.5rem;
        color: var(--ref-muted, #64748b);
        user-select: none;
        line-height: 1;
        flex-shrink: 0;
    }
    .topology-ref-connector--problem {
        position: relative;
        min-width: 2rem;
        color: var(--ref-muted, #64748b);
    }
    .topology-ref-link-line {
        display: block;
        font-size: 1.5rem;
        font-weight: 500;
        line-height: 1;
        color: #94a3b8;
        text-decoration: line-through;
        text-decoration-color: rgba(220, 38, 38, 0.45);
        text-decoration-thickness: 2px;
    }
    .topology-ref-link-x {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -52%);
        font-size: 1.05rem;
        font-weight: 800;
        color: #c62828;
        line-height: 1;
        pointer-events: none;
        text-shadow: 0 0 2px #fff, 0 0 4px #fff;
    }
    .topology-ref-ips--overlay {
        background: rgba(255, 255, 255, 0.72);
    }
    .topology-ref-underlay-hint {
        font-size: 0.7rem;
        color: var(--ref-muted, #64748b);
        text-align: center;
        margin: 10px 0 0;
        line-height: 1.45;
    }
    .topology-ref-meta {
        text-align: center;
        width: 100%;
        max-width: 200px;
        padding: 0 4px;
    }
    .topology-ref-role {
        font-weight: 800;
        font-size: 0.95rem;
        line-height: 1.25;
        color: var(--ref-ink, #1e293b);
    }
    .topology-ref-sub {
        margin-top: 4px;
        font-size: 0.75rem;
        color: var(--ref-muted, #64748b);
    }
    .topology-ref-ips {
        margin-top: 6px;
        font-size: 0.72rem;
        color: var(--ref-muted, #64748b);
        line-height: 1.45;
        font-family: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
        background: #f1f5f9;
        padding: 8px 10px;
        border-radius: 12px;
        text-align: left;
    }
    .topology-ref-ips strong {
        color: var(--ref-ink, #1e293b);
        font-weight: 600;
    }
    .topology-ref-ips-muted {
        color: #94a3b8;
    }
    .topology-ref-overlay-band {
        margin-top: 14px;
        padding: 14px 12px 16px;
        border-radius: 12px;
        background: rgba(248, 250, 252, 0.92);
        border: 1px solid #e2e8f0;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }
    .topology-ref-overlay-band .topology-ref-layer-title--overlay {
        color: #5b21b6;
        letter-spacing: 0.02em;
    }
    .topology-ref-overlay-band .topology-placeholder {
        margin-top: 4px;
        background: rgba(255, 255, 255, 0.65);
    }
    .topology-ref-overlay-arc {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        align-self: center;
    }
    .topology-ref-tunnel-path {
        fill: none;
        stroke: var(--ref-purple, #7c3aed);
        opacity: 0.9;
    }
    .topology-ref-tunnel-cap {
        fill: var(--ref-purple, #7c3aed);
        font-size: 11px;
        font-weight: 700;
    }
    .topology-ref-overlay-arc--problem .topology-ref-tunnel-path {
        stroke: #b45309;
        opacity: 0.85;
    }
    .topology-ref-overlay-arc--problem .topology-ref-tunnel-cap {
        fill: #b45309;
    }
    .topology-ref-overlay-x {
        fill: #94a3b8;
        font-size: 17px;
        font-weight: 800;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .topology-ref-overlay-arc--problem .topology-ref-overlay-x {
        fill: #b45309;
    }
    .topology-strip-wrap.topology-ref-stage .topology-ref-bubble {
        position: relative;
        width: clamp(84px, 18vw, 112px);
        height: clamp(84px, 18vw, 112px);
        border-radius: 50%;
        border: 4px solid #fff;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.06), var(--ref-shadow, 0 8px 24px rgba(30, 41, 59, 0.08));
    }
    .topology-strip-wrap.topology-ref-stage .topology-ref-bubble::after {
        content: "";
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-top: 12px solid #fff;
        filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.04));
        pointer-events: none;
    }
    .topology-strip-wrap.topology-ref-stage .topology-ref-bubble svg {
        width: min(64px, 58%);
        height: min(64px, 58%);
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
    }
    .topology-strip-wrap .topology-node {
        flex: 1 1 0;
        min-width: 140px;
        max-width: 280px;
        padding: 10px 12px;
    }
    .topology-strip-wrap .topology-node-compact {
        flex: 1.05 1 0;
        min-width: 150px;
        max-width: 280px;
    }
    .topology-strip-wrap .topology-node-endpoint {
        min-width: 130px;

    }
    .topology-strip-wrap .topology-node-name {

    }
    .topology-strip-wrap .topology-node-id {

    }
    .topology-strip-wrap .topology-io-columns {

    }
    .topology-strip-wrap .topology-io-col-right {

    }
    .topology-strip-wrap .topology-io-title {
        font-size: 0.74em;
    }
    .topology-strip-wrap .topology-io-line {
        font-size: 0.72em;
    }
    .topology-strip-wrap .topology-io-muted {
        font-size: 0.72em;
    }
    .topology-strip-wrap .topology-endpoint-lines {
        margin-top: 6px;

    }
    .topology-strip-wrap .topology-tunnel-lines {

    }
    .topology-strip-wrap .topology-tunnel-row {
        font-size: 0.78em;
        flex-wrap: wrap;
    }
    .topology-strip-wrap .topology-tunnel-label {

    }
    .topology-strip-wrap .topology-hop {
        flex: 0 0 auto;

    }
    .topology-strip-wrap .topology-arrow {
        font-size: 1.35em;
    }
    .topology-strip-wrap .topology-hop-tag {
        font-size: 0.7em;
    }

    .topology-strip-wrap .topology-cartoon-node {
        flex: 1 1 0;

        padding: 6px 8px;
    }
    .topology-strip-wrap .topology-cartoon-overlay-pe {
        flex: 1.05 1 0;
        min-width: 150px;
        max-width: 280px;
    }
    .topology-strip-wrap .topology-cartoon-endpoint {
        min-width: 130px;
        max-width: 240px;
    }

    .topology-row-label {
        font-size: 0.82em;
        font-weight: 700;
        color: var(--text-secondary);
        letter-spacing: 0.02em;
        margin-bottom: 6px;
    }

    .topology-flow-overlay {
        margin-top: 2px;
    }

    .topology-node-compact {
        min-width: 150px;
    }

    .topology-node {
        min-width: 200px;
        max-width: 320px;
        padding: 12px 14px;
